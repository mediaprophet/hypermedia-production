[package]
name = "discourse-academic-tex"
description = "Categorical academic TeX typesetting, parsing, CTAN catalog, TrueType PDF generator, bibliography converter, and collaborative review proposals"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
