[package]
name = "layout-nodegraph-compiler"
description = "Pure-Rust typed dataflow node graph compiler with composite inlining, CSE deduplication, dead-code elimination, and unit-aware algebraic expression parser"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
