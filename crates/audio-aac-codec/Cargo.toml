[package]
name = "audio-aac-codec"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "AAC-LC compressed-audio encoding and decoding"

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { package = "bitstream-codec", path = "../bitstream-codec" }
thiserror = "2"
rayon = { version = "1", optional = true }

[dev-dependencies]
filmcraft-testkit = { package = "media-test-support", path = "../media-test-support" }

[lints.rust]
unsafe_code = "forbid"
