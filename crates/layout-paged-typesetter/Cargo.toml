[package]
name = "layout-paged-typesetter"
description = "Categorical paged document typesetting engine with mathematical equation AST & layout, bidirectional LaTeX/UnicodeMath converters, Liang TeX hyphenation, Kinsoku Shori CJK line-breaking, table auto-fit, multi-page pagination with widow/orphan control, and CSL citations"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
