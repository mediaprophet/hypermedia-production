[package]
name = "chronicle-fiduciary-ledger"
description = "Categorical fiduciary ledger: exact fixed-point multi-currency arithmetic, balanced double-entry journals, ASC 606 / IFRS 15 rev rec, asset depreciation, multi-entity consolidation, and hash-chained fiduciary audit trails"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
