[workspace]
resolver = "3"
members = ["crates/*", "checks/consumer-smoke"]
# The controlled CPAL fork is consumed as a patched path dependency by Poet;
# its upstream examples/dev dependencies are not shared-workspace checks.
exclude = ["crates/audio-device-cpal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { git = "https://github.com/mediaprophet/qualiaDB.git", rev = "1cda297f78786ae498c1d5e01f68b531810eb46c" }
