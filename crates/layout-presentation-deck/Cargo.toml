[package]
name = "layout-presentation-deck"
description = "Categorical presentation deck engine with master/layout placeholder inheritance, shape morph correspondence matching, cubic Bézier path morph interpolation, click-sequence animation groups, and presentation show state machine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
