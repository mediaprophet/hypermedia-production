[package]
name = "vector-locus-pathops"
description = "Categorical locus vector path operations: booleans, shape builder planar graph, distortion effects, 15 warp envelopes, and 3D revolution"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
vector-locus-geometry = { path = "../vector-locus-geometry" }
kurbo = { version = "0.13.1", features = ["serde"] }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
