[package]
name = "manifold-bim-csg"
description = "Pure Rust work-metered non-recursive 3D BSP CSG booleans, STEP parser, IFC4 architectural exporter, and parametric BIM geometry"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
