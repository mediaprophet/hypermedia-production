[package]
name = "vector-glyph-shaping"
description = "Categorical glyph shaping: OpenType features, UAX #9 BiDi run ordering, Knuth-Plass optimal line-breaking composer, hyphenation, and text layout"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
kurbo = { version = "0.13.1", features = ["serde"] }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
