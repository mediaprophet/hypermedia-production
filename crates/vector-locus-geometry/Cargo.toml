[package]
name = "vector-locus-geometry"
description = "Categorical locus geometry: paths, anchors, live corners, homography perspective grids, gestures, and units"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
kurbo = { version = "0.13.1", features = ["serde"] }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
