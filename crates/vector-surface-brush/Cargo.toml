[package]
name = "vector-surface-brush"
description = "Categorical surface brush engines: calligraphic, scatter, art spine warp, pattern, and bristle procedural brushes"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
vector-locus-geometry = { path = "../vector-locus-geometry" }
kurbo = { version = "0.13.1", features = ["serde"] }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
