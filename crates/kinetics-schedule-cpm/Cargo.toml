[package]
name = "kinetics-schedule-cpm"
description = "Project scheduling engine: CPM forward/backward passes, 8 constraint types, ANSI/EIA-748 EVM, resource leveling, Monte Carlo simulation, MSPDI XML/P6 XER interop, and change DAG"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
serde = { workspace = true }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
